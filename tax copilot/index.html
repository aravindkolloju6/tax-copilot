<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxCopilot AI - Your Virtual CA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Babel Standalone for browser-side TSX/TypeScript support -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "recharts": "https://esm.sh/recharts@^3.7.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
      }
    }
    </script>

    <!-- Shim process.env for environment variable support in the browser -->
    <script>
      // Ensures the process object exists for libraries that expect it
      window.process = window.process || { env: {} };
      
      /**
       * Netlify Environment Variable Note:
       * When deploying to Netlify, process.env.API_KEY is available during the build phase.
       * For a no-build ESM deployment like this, you must ensure the key is passed 
       * to the client. This shim prevents crashes if the key is missing.
       */
      if (typeof window !== 'undefined' && !window.process.env.API_KEY) {
        // Fallback or injected value can be placed here by Netlify Build Plugins if needed
        window.process.env.API_KEY = window.process.env.API_KEY || "";
      }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
    
    <!-- Load the main application module -->
    <!-- type="text/babel" tells Babel Standalone to transpile this file -->
    <!-- data-type="module" ensures it behaves as an ES module -->
    <script type="text/babel" data-type="module" data-presets="typescript,react" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
